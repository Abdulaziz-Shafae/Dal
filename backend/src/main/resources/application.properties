spring.application.name=Dal

# Set these environment variables before testing with MySQL or sending reset emails.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:dal.support.sa@gmail.com}
brevo.sender-name=${BREVO_SENDER_NAME:Dal}
password.reset-url=${PASSWORD_RESET_URL:}

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Railway provides PORT at runtime.
server.port=${PORT:8080}
